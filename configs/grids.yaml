# Named grids. Every canonical store records a grid_id from this file.

knmi_1km_stereo:
  description: KNMI radar composite product grid (verified from geo_product_corners)
  proj4: "+proj=stere +lat_0=90 +lon_0=0 +lat_ts=60 +a=6378140 +b=6356750 +x_0=0 +y_0=0 +units=km +no_defs"
  # KNMI writes the ellipsoid axes in km in the HDF5 attribute, which PROJ rejects
  # as a non-Earth body. The axes above are the metre equivalent + units=km.
  shape: [765, 700]          # rows (y), cols (x)
  pixel_size_km: [1.0000013, -1.0000055]
  extent_km: {x: [0.0, 700.0], y: [-4415.0, -3650.0]}
  product_corners_lonlat:    # LL, UL, UR, LR
    - [0.000000, 49.362053]
    - [0.000000, 55.973602]
    - [10.856429, 55.388977]
    - [9.009279, 48.895298]

# A window of the EUMETNET OPERA 2 km composite grid (1900 x 2200, LAEA,
# upper-left CORNER at projected (0, 0), rows running south), kept natively -
# no resampling - around the 1536 km KNMI polar-stereographic training square
# centred on 52.2N 5.3E. That square's edges, densified and projected to LAEA,
# span native cols 408.4-1249.4 and rows 775.0-1616.3 (pixels 408-1249,
# 775-1616: 842 x 842); the window adds 19 px on every side to 880 x 880:
# rows 756-1635, cols 389-1268. Extent in metres (the projection's units).
# Must agree with configs/products/radar/opera/rate_15min.yaml extra.opera.window,
# which the stream checks at start-up.
opera_2km_laea_nl:
  description: >-
    OPERA 2 km composite grid, native window rows 756-1635, cols 389-1268
    (880 x 880) around the 1536 km KNMI training square
  proj4: "+proj=laea +lat_0=55.0 +lon_0=10.0 +x_0=1950000.0 +y_0=-2100000.0 +units=m +ellps=WGS84"
  shape: [880, 880]          # rows (y), cols (x)
  extent: {x: [778000.0, 2538000.0], y: [-3272000.0, -1512000.0]}

# The RainPro-NL 16 km model frame: a 1536 km square on the KNMI radar
# polar-stereographic projection (same proj4 as knmi_1km_stereo), centred on the
# RTCOR crop at x = 350 km, y = -4032 km (~52.2N 5.3E). 96 x 96 cells of 16 km,
# north-up (row 0 is the northern edge). Cell edges x -418 .. 1118 km,
# y -4800 .. -3264 km. The NWP inputs (GFS) are regridded onto it.
knmi_stereo_16km_1536:
  description: >-
    1536 km x 1536 km model frame at 16 km (96 x 96) on the KNMI polar-stereographic
    projection, centred x = 350 km, y = -4032 km
  proj4: "+proj=stere +lat_0=90 +lon_0=0 +lat_ts=60 +a=6378140 +b=6356750 +x_0=0 +y_0=0 +units=km +no_defs"
  shape: [96, 96]            # rows (y), cols (x)
  extent: {x: [-418.0, 1118.0], y: [-4800.0, -3264.0]}

# NOAA GFS 0.25 deg latitude/longitude grid, cropped natively (no resampling) to a
# window around the 1536 km knmi_stereo_16km_1536 frame: that frame's edges, densified
# and projected, span 7.30W-18.91E, 45.07N-59.40N; the window is the enclosing 0.25 deg
# nodes plus 2 more on every side (margin for bilinear interpolation at load time):
# cell centres 8.00W..19.50E (111 columns), 60.00N..44.50N (63 rows), north-up.
# Extent = cell edges, in degrees. GFS column = ((lon - 0) mod 360) / 0.25,
# row = (90 - lat) / 0.25; checked at stream start-up (meteopack.sources.nwp.gfs.Crop).
gfs_0p25_latlon_nl:
  description: >-
    GFS 0.25 deg lat/lon grid, native window 8.00W-19.50E x 44.50N-60.00N (cell centres,
    63 x 111) around the 1536 km KNMI-stereo model frame plus a 2-point margin
  proj4: "+proj=longlat +datum=WGS84 +no_defs"
  shape: [63, 111]           # rows (lat, north first), cols (lon)
  extent: {x: [-8.125, 19.625], y: [44.375, 60.125]}

# Placeholders — fill when the corresponding source lands.
# msg_rss_nl_crop:
# harmonie_p1:

# A tiny grid for tests and examples. Real, loadable, and cheap: 8x6 cells over
# the North Sea. Exists so initialise/write can be exercised through the real
# registry instead of a monkeypatched one.
example_tiny:
  description: 8x6 example grid, same projection as the KNMI product
  proj4: "+proj=stere +lat_0=90 +lon_0=0 +lat_ts=60 +a=6378140 +b=6356750 +x_0=0 +y_0=0 +units=km +no_defs"
  shape: [8, 6]
  product_corners_lonlat:
    - [3.0, 52.0]
    - [3.0, 53.0]
    - [5.0, 53.0]
    - [5.0, 52.0]
