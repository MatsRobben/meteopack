# E-SOH / MeteoGate surface observations, clipped to the KNMI radar footprint.
#
# Loads into meteopack.core.config.ProductConfig. The variable map is the whole
# of the source-specific knowledge: `source_key` is the API's own parameter
# name, "<standard_name>:<level>:<method>:<period>", which is exactly what the
# CoverageJSON range is keyed by and what `standard_name=` filters on.
#
# Every level is written `*`, deliberately. The level field is frequently the
# station elevation rather than the sensor height -- the live catalogue lists
# 1176 distinct levels for air_pressure:*:point:PT0S, among them 1003.0 and
# 1029.0 -- so pinning a number would match a handful of stations by accident.
# `method` and `period` are never wildcards: those are what the number means.
#
# Missing values arrive as JSON null, so there is no sentinel to null out here.
# `extra.missing_sentinels` exists for the day a national feed pushes one
# through unchanged; it is applied before scale/offset, and valid_min/valid_max
# are in the canonical units below (i.e. post-scale).

source: esoh
product: observations
version: 1

# Declared for the store's time axis, and for joining against dwd/stations_10min.
# `parse` does NOT snap to it: cadence here is genuinely heterogeneous per
# station and per parameter (PT1M, PT10M, PT1H and PT3H all occur), so rows are
# written as reported and resampling is left to the derive layer.
cadence_seconds: 600

grid_id: knmi_1km_stereo      # stations outside this footprint are dropped;
                              # set to null (and optionally set extra.bbox) for
                              # a Europe-wide harvest

store:
  kind: points
  chunks:
    time: 4032                # 4 weeks of 10-minute steps
    station: 64
  compressor: zstd
  compression_level: 3
  partition_by: [year]

raw_layout:
  archive: none               # one CoverageJSON per station-slot; if the station
  granularity: day            # count grows this wants archive: tar per day

retention:
  raw:
    keep: true                # NOT optional: upstream has no archive, so the
    tier: cold                # raw layer is the only copy that will ever exist
  canonical:
    keep: true
  derived:
    keep: true

variables:
  - name: air_temperature
    source_key: "air_temperature:*:point:PT0S"
    units: degC
    long_name: Air temperature (instantaneous)
    dtype: float32
    valid_min: -60.0
    valid_max: 60.0

  - name: dew_point_temperature
    source_key: "dew_point_temperature:*:point:PT0S"
    units: degC
    long_name: Dew point temperature (instantaneous)
    dtype: float32
    valid_min: -60.0
    valid_max: 50.0

  - name: relative_humidity
    source_key: "relative_humidity:*:point:PT0S"
    units: "%"
    long_name: Relative humidity (instantaneous)
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: air_pressure
    source_key: "air_pressure:*:point:PT0S"
    units: hPa
    long_name: Air pressure at station height
    dtype: float32
    valid_min: 500.0
    valid_max: 1100.0

  - name: air_pressure_at_sea_level
    source_key: "air_pressure_at_mean_sea_level:*:point:PT0S"
    units: hPa
    long_name: Air pressure reduced to mean sea level
    dtype: float32
    valid_min: 800.0
    valid_max: 1100.0

  # Two precipitation columns, not one. E-SOH reports accumulations over
  # several periods and the hourly sum is far more widely available than the
  # 10-minute one; folding them into a single column would silently compare a
  # 10-minute total against an hourly one, here and against DWD.
  - name: precipitation_amount
    source_key: "precipitation_amount:*:sum:PT10M"
    units: mm
    long_name: Precipitation sum over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 200.0

  - name: precipitation_amount_1h
    source_key: "precipitation_amount:*:sum:PT1H"
    units: mm
    long_name: Precipitation sum over the preceding hour
    dtype: float32
    valid_min: 0.0
    valid_max: 500.0

  - name: wind_speed
    source_key: "wind_speed:*:mean:PT10M"
    units: m s-1
    long_name: Mean wind speed over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 120.0

  - name: wind_from_direction
    source_key: "wind_from_direction:*:mean:PT10M"
    units: degree
    long_name: Mean wind direction over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 360.0

  - name: wind_speed_of_gust
    source_key: "wind_speed_of_gust:*:maximum:PT10M"
    units: m s-1
    long_name: Maximum wind gust over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 150.0

  - name: surface_downwelling_shortwave_flux
    source_key: "surface_downwelling_shortwave_flux_in_air:*:mean:PT10M"
    units: W m-2
    long_name: Global radiation, mean over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 1500.0

  - name: sunshine_duration
    source_key: "duration_of_sunshine:*:sum:PT10M"
    units: s
    long_name: Sunshine duration over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 600.0

  - name: visibility_in_air
    source_key: "visibility_in_air:*:point:PT0S"
    units: m
    long_name: Horizontal visibility (instantaneous)
    dtype: float32
    valid_min: 0.0
    valid_max: 100000.0

  # Alternates for a second national reporting convention, verified live at
  # De Bilt (0-20000-0-06260) on 2026-10-31: KNMI publishes humidity, dew point
  # and MSL pressure as 1-minute points, and wind as instantaneous values,
  # where DWD publishes 10-minute means. They are separate columns rather than
  # a widened selector because a 1-minute point is not a 10-minute mean, and
  # folding them together would make the same column mean different things
  # depending on which country a station sits in. A station reports one or the
  # other, so the unused column is simply null for it.
  - name: dew_point_temperature_1m
    source_key: "dew_point_temperature:*:point:PT1M"
    units: degC
    long_name: Dew point temperature, 1-minute point
    dtype: float32
    valid_min: -60.0
    valid_max: 50.0

  - name: relative_humidity_1m
    source_key: "relative_humidity:*:point:PT1M"
    units: "%"
    long_name: Relative humidity, 1-minute point
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: air_pressure_at_sea_level_1m
    source_key: "air_pressure_at_mean_sea_level:*:point:PT1M"
    units: hPa
    long_name: Air pressure reduced to mean sea level, 1-minute point
    dtype: float32
    valid_min: 800.0
    valid_max: 1100.0

  - name: wind_speed_instant
    source_key: "wind_speed:*:point:PT0S"
    units: m s-1
    long_name: Instantaneous wind speed
    dtype: float32
    valid_min: 0.0
    valid_max: 120.0

  - name: wind_from_direction_instant
    source_key: "wind_from_direction:*:point:PT0S"
    units: degree
    long_name: Instantaneous wind direction
    dtype: float32
    valid_min: 0.0
    valid_max: 360.0

  - name: wind_speed_of_gust_instant
    source_key: "wind_speed_of_gust:*:maximum:PT0S"
    units: m s-1
    long_name: Maximum wind gust since the previous report
    dtype: float32
    valid_min: 0.0
    valid_max: 150.0

  - name: surface_snow_thickness
    source_key: "surface_snow_thickness:*:point:PT0S"
    units: m
    long_name: Snow depth
    dtype: float32
    scale: 0.01               # E-SOH publishes snow depth in cm
    valid_min: 0.0
    valid_max: 10.0

# Hash of extra.known_measurements below, as `scan` reports it. Editing that
# catalogue without re-pinning this makes `parse` fail loudly rather than
# quietly widening what counts as known.
schema_fingerprint: "13980466f2ff7c28"

extra:
  # One ledger entry per station per hour. See meteopack.sources.esoh.unit_key:
  # flooring onto this grid is what makes a key stable across retries, and
  # advancing time is what makes the next harvest's keys distinct -- which, for
  # a feed with no archive, is the difference between harvesting and skipping.
  harvest_slot_seconds: 3600

  # How far back the collection still serves, per its own temporal extent. A
  # window reaching further back is clamped to this, with a warning.
  rolling_window_hours: 24

  # Missing arrives as JSON null; this is here for a feed that pushes a numeric
  # sentinel through instead. Applied before scale/offset.
  missing_sentinels: []

  # Captured from the live /collections document on 2026-10-31. These are
  # level-free "<standard_name>:<method>:<period>" triples -- the level is left
  # out on purpose, since including it would make every station its own schema.
  # A station reporting a SUBSET of these is normal and passes; a station
  # reporting something not listed is drift and fails. Re-run `scan` and re-pin
  # this together with schema_fingerprint above after checking what moved.
  known_measurements:
    air_pressure:
      - air_pressure:mean:PT1H
      - air_pressure:mean:PT1M
      - air_pressure:point:PT0S
      - air_pressure:point:PT10M
    air_pressure_at_mean_sea_level:
      - air_pressure_at_mean_sea_level:point:PT0S
      - air_pressure_at_mean_sea_level:point:PT1M
    air_temperature:
      - air_temperature:maximum:PT10M
      - air_temperature:maximum:PT12H
      - air_temperature:maximum:PT1H
      - air_temperature:maximum:PT24H
      - air_temperature:mean:PT1H
      - air_temperature:mean:PT1M
      - air_temperature:mean:PT24H
      - air_temperature:minimum:PT10M
      - air_temperature:minimum:PT12H
      - air_temperature:minimum:PT1H
      - air_temperature:minimum:PT24H
      - air_temperature:point:PT0S
      - air_temperature:point:PT10M
      - air_temperature:point:PT1M
    dew_point_temperature:
      - dew_point_temperature:mean:PT1M
      - dew_point_temperature:point:PT0S
      - dew_point_temperature:point:PT1M
    duration_of_sunshine:
      - duration_of_sunshine:point:PT0S
      - duration_of_sunshine:sum:PT10M
      - duration_of_sunshine:sum:PT1H
      - duration_of_sunshine:sum:PT1M
    precipitation_amount:
      - precipitation_amount:maximum:PT1H
      - precipitation_amount:minimum:PT1H
      - precipitation_amount:point:PT0S
      - precipitation_amount:point:PT10M
      - precipitation_amount:point:PT12H
      - precipitation_amount:point:PT1H
      - precipitation_amount:point:PT24H
      - precipitation_amount:point:PT3H
      - precipitation_amount:point:PT6H
      - precipitation_amount:sum:PT0S
      - precipitation_amount:sum:PT10M
      - precipitation_amount:sum:PT12H
      - precipitation_amount:sum:PT15H
      - precipitation_amount:sum:PT18H
      - precipitation_amount:sum:PT1H
      - precipitation_amount:sum:PT1M
      - precipitation_amount:sum:PT24H
      - precipitation_amount:sum:PT3H
      - precipitation_amount:sum:PT6H
      - precipitation_amount:sum:PT9H
    relative_humidity:
      - relative_humidity:maximum:PT10M
      - relative_humidity:maximum:PT1H
      - relative_humidity:mean:PT1H
      - relative_humidity:mean:PT1M
      - relative_humidity:mean:PT24H
      - relative_humidity:minimum:PT10M
      - relative_humidity:minimum:PT1H
      - relative_humidity:point:PT0S
      - relative_humidity:point:PT10M
      - relative_humidity:point:PT1M
    surface_downwelling_shortwave_flux_in_air:
      - surface_downwelling_shortwave_flux_in_air:mean:PT10M
      - surface_downwelling_shortwave_flux_in_air:mean:PT1H
      - surface_downwelling_shortwave_flux_in_air:mean:PT1M
    surface_snow_thickness:
      - surface_snow_thickness:maximum:PT1H
      - surface_snow_thickness:minimum:PT1H
      - surface_snow_thickness:point:PT0S
      - surface_snow_thickness:point:PT1M
    visibility_in_air:
      - visibility_in_air:mean:PT1M
      - visibility_in_air:point:PT0S
    wind_from_direction:
      - wind_from_direction:maximum:PT0S
      - wind_from_direction:maximum:PT1H
      - wind_from_direction:mean:PT10M
      - wind_from_direction:mean:PT1H
      - wind_from_direction:mean:PT1M
      - wind_from_direction:mean:PT2M
      - wind_from_direction:minimum:PT1M
      - wind_from_direction:point:PT0S
      - wind_from_direction:point:PT10M
      - wind_from_direction:point:PT24M
    wind_speed:
      - wind_speed:maximum:PT0S
      - wind_speed:maximum:PT1H
      - wind_speed:maximum:PT3H
      - wind_speed:maximum:PT6H
      - wind_speed:mean:PT10M
      - wind_speed:mean:PT1H
      - wind_speed:mean:PT1M
      - wind_speed:mean:PT2M
      - wind_speed:minimum:PT1H
      - wind_speed:point:PT0S
      - wind_speed:point:PT10M
      - wind_speed:point:PT24M
    wind_speed_of_gust:
      - wind_speed_of_gust:maximum:PT0S
      - wind_speed_of_gust:maximum:PT10M
      - wind_speed_of_gust:maximum:PT1H
      - wind_speed_of_gust:maximum:PT1M
      - wind_speed_of_gust:maximum:PT2M
      - wind_speed_of_gust:point:PT0S
      - wind_speed_of_gust:point:PT10M
      - wind_speed_of_gust:point:PT1H
      - wind_speed_of_gust:point:PT30M
      - wind_speed_of_gust:point:PT3H
      - wind_speed_of_gust:point:PT6H
