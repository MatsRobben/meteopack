# KNMI 5-minute real-time corrected radar composite (RAD_NL25_RAC_RT).
#
# Loads into meteopack.core.config.ProductConfig. The first gridded product
# here, and the one the gridded store's chunking was benchmarked on.
#
# `source_key` is a "|"-separated list of accepted HDF5 `image_geo_parameter`
# values, not an `imageN` group name. The group index moves between product
# generations -- `image2` is the gauge adjustment factor before 2023 and the
# quality index after -- while the parameter name identifies the content. The
# precipitation image was itself renamed PRECIP_[MM] -> ACCUMULATION_[MM] in
# 2023 without any change to what it holds, which is why one canonical variable
# lists both.

source: knmi_radar
description: >-
  KNMI real-time corrected radar rainfall over the Netherlands, 5-minute accumulations on the 765x700 national grid.
product: rtcor_5min
version: 1

cadence_seconds: 300          # the product's native 5-minute step
grid_id: knmi_1km_stereo      # (765, 700); asserted per frame against the file's
                              # own geo_number_rows/columns and geo_product_corners

store:
  kind: gridded
  # One frame per inner chunk, one daily tar per shard. See the module docstring
  # of meteopack.core.store.gridded: 1-frame chunks serve 63-89 warm frame
  # reads/s against 3-5 for a packed [288, 765, 700] chunk, and sharding is what
  # keeps that to one file per day instead of 288.
  chunks:
    time: 1
    y: 765
    x: 700
  shard:
    time: 288                 # exactly one tar, so exactly one Slurm task
    y: 765
    x: 700
  compressor: zstd
  compression_level: 3
  partition_by: [year]

raw_layout:
  archive: tar                # upstream already ships one tar per day
  granularity: day

retention:
  raw:
    keep: true
    tier: cold                # hardlinked to the archive, so ~0 extra bytes
  canonical:
    keep: true
  derived:
    keep: true

# CF discovery metadata, written onto the store's root group so it describes
# itself on a machine that has never seen this repository.
attrs:
  title: >-
    KNMI real-time corrected 5-minute radar precipitation accumulation over the
    Netherlands (RAD_NL25_RAC_RT)
  institution: Royal Netherlands Meteorological Institute (KNMI)
  source: >-
    Composite of the Herwijnen and Den Helder C-band Doppler weather radars,
    gauge-adjusted against the KNMI automatic and manual rain gauge networks.
  references: https://dataplatform.knmi.nl/dataset/radar-reflectivity-composites-2-0
  comment: >-
    Fields are integer codes; decode with value = scale_factor * stored +
    add_offset. calibration_missing_data marks pixels the radar did not
    measure and calibration_out_of_image marks pixels outside the composite
    footprint - they are different facts and are kept apart. KNMI publishes a
    quality value only where there is an echo, so `quality` is
    missing over dry pixels by design.

variables:
  # Encodings are the product's own. Sampled across the archive on 2026-11-01,
  # the 2023-and-later generation writes exactly these dtypes, scales and
  # sentinels, so a modern frame re-encodes to itself bit for bit and an older
  # one is converted once, at pack time, onto the same scale.
  - name: accumulation_mm
    source_key: "PRECIP_[MM]|ACCUMULATION_[MM]"
    units: mm
    standard_name: precipitation_amount
    long_name: Radar precipitation accumulation over the preceding 5 minutes
    valid_min: 0.0
    # The field is mm accumulated in 5 minutes, NOT a rate: image_geo_parameter
    # reads PRECIP_[MM] / ACCUMULATION_[MM] and the calibration gives mm. A
    # uint16 count scales to at most 655.33 mm, so this cap also catches any
    # unresolved sentinel that slipped through as a plausible number.
    valid_max: 200.0
    no_echo: 0.0   # no rain is 0 mm
    encoding:
      dtype: uint16
      scale: 0.01                       # 0.01 mm, the product's own resolution
      offset: 0.0
      missing: 65534
      out_of_image: 65535

  - name: quality
    source_key: "QUALITY_[-]"
    units: "1"
    # no CF standard name exists for a radar composite quality index
    long_name: Per-pixel radar composite quality index (0 worst, 1 best)
    valid_min: 0.0
    valid_max: 1.0
    encoding:
      dtype: uint8
      scale: 0.004                      # 0..253 covers 0..1.012
      offset: 0.0
      missing: 254
      out_of_image: 255
    # Only the 2023-and-later generations carry this image. Before that the
    # product ships no per-pixel quality at all: image2 there is the gauge
    # ADJUSTMENT_FACTOR_[DB] below, which is a different quantity and is read
    # as one. Frames with no quality image keep the `missing` sentinel, which
    # is the honest answer and is distinguishable from a quality of zero.

  - name: adjustment_factor_db
    source_key: "ADJUSTMENT_FACTOR_[DB]"
    units: dB
    long_name: Gauge adjustment factor applied to the radar accumulation
    valid_min: -20.24
    valid_max: 20.24
    encoding:
      dtype: uint8
      scale: 0.16                       # 0..253 covers -20.24..+20.24 dB
      offset: -20.24
      missing: 254
      out_of_image: 255
    # Present in the 2018-2022 frames as image2 and in the 2023+ frames as
    # image3. Addressing it by image_geo_parameter rather than by group index
    # is what keeps those two from being confused with the quality index.

# Hash of extra.known_layouts below, as `scan` reports it (product_fingerprint).
# Editing that list without re-pinning this makes `parse` fail loudly rather
# than quietly widening what counts as known.
schema_fingerprint: 4601c33369cd37b3

extra:
  # Where the daily tars live. Overrides the source config's base_url.
  archive_root: ${KNMI_RADAR_ARCHIVE}

  # A KNMI radar day runs 08:05 UTC to 08:00 UTC the next day -- 288 frames,
  # the first five minutes after the nominal 08:00 start. This is the fallback
  # for a tar whose filename cannot be read (one archived name carries a stray
  # digit: 20181220T0080000); well-formed names are read from themselves, which
  # is how the two 2018 tars still using the older T080000_...T075500
  # convention get the right first frame.
  #
  # CONSEQUENCE FOR THE PLANNER: initialise the store with a Timeline that
  # starts at an 08:05 UTC instant. Shards are 288 frames, so an 08:05-aligned
  # axis puts each tar in exactly one shard and lets one task own it. A midnight
  # axis splits every tar across two shards, and gridded.write is explicit that
  # two tasks writing one shard silently lose frames.
  day_start: "08:05"

  # What calibration_missing_data means. See meteopack.sources.knmi_radar.calibrate.
  #   no_echo_if_zero - the default, and the only one that is right for this
  #                     archive. A sentinel of 0 (every generation before 2023)
  #                     collides with a genuine dry pixel: it means NO ECHO, a
  #                     real 0 mm, not missing. A sentinel of 65534 (2023 on)
  #                     sits outside the data range and is genuinely missing, so
  #                     NaN. calibration_out_of_image (65535) is always NaN.
  #   no_echo         - force 0 mm. Would turn every 65534 into a confident zero.
  #   missing         - force NaN. Would turn every dry pixel before 2023 into
  #                     missing data across the whole archive.
  missing_data_policy: no_echo_if_zero

  # geo_product_corners is float32 and wobbles in the 5th decimal between
  # generations (49.362053 vs 49.362064). 1e-3 degrees is ~100 m, well under
  # one 1 km pixel, so a genuine re-cornering still fails.
  corner_tolerance_deg: 0.001

  # Every distinct image layout seen, as `scan` reports it. A layout is the set
  # of images in a frame, each as
  # "<geo_parameter>|<dtype>|<rows>x<cols>|scale=|offset=|missing=|out_of_image=",
  # hashed order-independently. The group name is deliberately not part of it:
  # the index moves, the content is what matters.
  #
  #   9ad3a06bbce5d4fc  2018-12 .. 2019-06  PRECIP + ADJUSTMENT, both uint16
  #   4fd1994af350b24b  same era, 16 frames of 5760  PRECIP as uint8
  #   22575bf4da70e1ae  2019-08 .. 2023-01  PRECIP alone, uint16
  #   3b0d9e40660f02f0  2023-03 .. 2024-03  ACCUMULATION + QUALITY + ADJUSTMENT, uint16
  #   ceecc00358aaec88  2024-05 ..          ACCUMULATION uint16, QUALITY + ADJUSTMENT uint8
  #
  # THE LAYOUT CHANGES WITHIN A DAY, NOT ONLY BETWEEN GENERATIONS. KNMI narrows
  # an individual frame to uint8 when the whole field fits: ten frames of
  # 2019-06-01 are uint8 inside a day of uint16, and they keep quoting
  # out_of_image = 65535, which no uint8 pixel can hold. `calibrate` clamps such
  # a sentinel to the dtype maximum -- see knmi_radar.representable_sentinel --
  # because reading it literally leaves the footprint mask unmasked and turns
  # ~104 000 out-of-image pixels into 2.55 mm of rain.
  #
  # Captured on 2026-11-01 from a pack over the WHOLE archive (2680 tars,
  # 770 115 frames), not a sample: `pack` writes the layout census it saw to
  # scan_report.json beside the store, and these are its fingerprints with the
  # frame counts it recorded. The first scan sampled every 134th tar and found
  # 5 of these 11; the six it missed are the rare ones below, 1 to 14 frames
  # each. Nothing was mis-read either way -- images are addressed by
  # image_geo_parameter and each carries its own calibration -- but an unpinned
  # layout is a loud error, which is the point: re-pin from scan_report.json
  # after a backfill, and re-pin schema_fingerprint with it.
  known_layouts:
    - 22575bf4da70e1ae    # 370099 frames, e.g. RAD_NL25_RAC_RT_201907221340.h5
    - ceecc00358aaec88    # 215376 frames, e.g. RAD_NL25_RAC_RT_202404060805.h5
    - 3b0d9e40660f02f0    # 123182 frames, e.g. RAD_NL25_RAC_RT_202302010805.h5
    - 9ad3a06bbce5d4fc    #  57939 frames, e.g. RAD_NL25_RAC_RT_201812280805.h5
    - 4fd1994af350b24b    #   3457 frames, e.g. RAD_NL25_RAC_RT_201902082200.h5
    - 668e6dc217d173cb    #     14 frames, e.g. RAD_NL25_RAC_RT_202405221650.h5
    - e0928e5076291fb2    #      4 frames, e.g. RAD_NL25_RAC_RT_202601292230.h5
    - aefabc03aeff1794    #      3 frames, e.g. RAD_NL25_RAC_RT_202302220050.h5
    - 1cc47bbb0b7f6520    #      3 frames, e.g. RAD_NL25_RAC_RT_202311040200.h5
    - 827cd86d4fb0aa4a    #      2 frames, e.g. RAD_NL25_RAC_RT_201905151520.h5
    - 4d91f25f08fe2b48    #      1 frame,  e.g. RAD_NL25_RAC_RT_201907191945.h5
  # A daily tar runs 08:05 -> 08:00, so the store's time axis must start on an
  # 08:05 instant. On a midnight-origin axis every tar straddles two shards, two
  # adjacent tars share the middle one, and the tasks holding them lose whole
  # frames (a zarr shard is one file: concurrent writers lose, not corrupt).
  timeline_origin: "2018-12-19T08:05:00Z"
