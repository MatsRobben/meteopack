# NOAA GFS 0.25 degree forecast -> the 122 RainPro-8 input fields (Pablos et al., ICLR 2026,
# Appendix I, Table 11), hourly, regridded to the 16 km RainPro-NL model frame.
#
# STREAMED from the public AWS archive (s3://noaa-gfs-bdp-pds, anonymous) one UTC day at a
# time by `meteopack stream noaa_gfs --product state_1h_16km`, which fills this store AND
# the precipitation store (extra.gfs.prate.product) in one pass:
#   .idx -> byte-range GETs of only the wanted GRIB messages -> schema check -> decode ->
#   regrid -> encode -> write -> read back. Nothing raw is kept (quarantine excepted).
# (meteopack.jobs.stream_gfs, reader meteopack.sources.nwp.gfs). `fetch`/`pack` refuse it.
#
# Time = VALID hour H. The frame comes from run floor6(H) (00/06/12/18 UTC) at lead
# H - floor6(H) = 0..5 h: the newest run started at or before H, no latency emulated.
# If that run's file is absent upstream, the frame comes from the previous run at lead
# 6..11 (`is_fallback` = 1). Per frame: `source_run_time`, `source_lead_h`.
# All fields are the INSTANTANEOUS ones (GRIB "anl" / "L hour fcst"), never time means.
#
# Coverage of the archive (scan of every run 2021-01-01 .. 2026-11-08, see docs/stores.md):
#   2021-01-01 .. 2021-02-25 18z  only leads f000, f003, ... (3-hourly backfill): hours
#                                 not divisible by 3 are missing; 7 runs absent entirely
#   .. 2021-03-22 06z  GFS v15: no CAPE/CIN 90-0 hPa, no LCDC/MCDC, TCDC entire atmosphere
#                      only as a time mean (not used); SPFH isobaric + ICETK in pgrb2b
#   2021-02-26 .. 2023-02-02 and 2023-05-01: no CLMR on pressure levels
#   2023-02-03 ..      all 122 fields
# A field absent upstream reads as the `missing` code (65534) for that frame; nothing is
# substituted from another field. `n_fields_missing` counts them per frame.
source: noaa_gfs
description: >-
  NOAA GFS 0.25 deg, the 122 RainPro-8 input fields (instantaneous), hourly valid times
  from the newest run (leads 0-5 h), bilinear to the 16 km 1536 km KNMI-stereo model frame,
  uint16 per-field scale/offset.
product: state_1h_16km
version: 1

cadence_seconds: 3600
grid_id: knmi_stereo_16km_1536

store:
  kind: gridded
  # One valid hour per inner chunk (96 x 96 = 18 KB raw); 7 days (168 h) per shard, so the
  # full archive is ~37k files (122 fields x ~310 weeks) rather than ~261k with one-day
  # shards. The stream writes a day at a time into its week's shard (one writer, under the
  # stream's lock), which rewrites that shard file: 4 days streamed in 131 s against 132 s
  # with one-day shards; 30-day shards took 221 s (2026-11-09, 12 CPUs, 32 workers).
  chunks: {time: 1, y: 96, x: 96}
  shard: {time: 168, y: 96, x: 96}
  compressor: blosc
  compression_level: 5
  partition_by: [year]

raw_layout: {archive: none, granularity: day}

retention:
  # No raw files at all: messages live in memory. Ones that fail their check are kept
  # in raw/nwp/noaa_gfs/state_1h_16km/quarantine/.
  raw: {keep: false, after: pack}
  canonical: {keep: true}
  derived: {keep: true}

attrs:
  title: NOAA GFS 0.25 deg, 122 RainPro-8 input fields, hourly, 16 km KNMI-stereo model frame
  institution: NOAA/NCEP (GFS); packed by meteopack
  source: >-
    NOAA Global Forecast System 0.25 deg forecasts (pgrb2.0p25 and pgrb2b.0p25 GRIB2), NOAA
    Open Data Dissemination on AWS, s3://noaa-gfs-bdp-pds (https://noaa-gfs-bdp-pds.s3.amazonaws.com).
    GFS v15 up to 2021-03-22 06z, v16 after (and its later updates).
  references: >-
    Pablos et al. (2026), RainPro-8, ICLR 2026, Appendix I (Table 11);
    https://www.nco.ncep.noaa.gov/pmb/products/gfs/
  comment: >-
    uint16 codes; value = scale * code + offset per field (the field's attrs). 65534 =
    field not available for this frame (absent upstream, or failed its check), 65535 =
    undefined at this pixel (masked by the GRIB bitmap, e.g. snow fields over sea). Bilinear
    from the 0.25 deg grid, masked neighbours dropped; CRAIN/CSNOW/CFRZR/CICEP/CPOFP nearest
    neighbour. Values outside a field's range are clipped (counted in the day status).
    PRATE converted to mm/h (x 3600).

