# KNMI 10-minute in-situ observations, clipped to the KNMI radar footprint.
#
# Loads into meteopack.core.config.ProductConfig. The variable map is the whole
# of the source-specific knowledge: `source_key` is the netCDF variable name
# inside a KMDS member, which is exactly what the file calls the column.
#
# Every unit is ONE DAY, stored as the daily tar KNMI publishes -- see
# raw_layout below and meteopack.sources.stations.knmi_insitu for why this feed cannot
# be fetched as loose files.
#
# Missing arrives as NaN (the files' _FillValue), which is nulled before
# scale/offset, and valid_min / valid_max are expressed in the canonical units
# below (i.e. post-scale).
#
# Units were read off the real archive rather than assumed. Two matter:
#   ss  is in MINUTES  -- 10 at full sun in a 10-minute interval (verified)
#   rg  is a mean RATE in mm/h over the interval, not an interval total

source: knmi_insitu
description: >-
  KNMI Dutch automatic weather stations, 10-minute observations.
product: obs_10min
version: 1

cadence_seconds: 600          # the feed's native 10-minute step
grid_id: knmi_1km_stereo      # stations outside this footprint are dropped

store:
  kind: points
  chunks:
    time: 4032                # 4 weeks of 10-minute steps
    station: 64
  compressor: zstd
  compression_level: 3
  partition_by: [year]

raw_layout:
  # The motivating case for archive: tar. KNMI publishes one file per ten
  # minutes and meters on request count, so 14 years of this feed is ~750k
  # members -- un-downloadable loose, and a filesystem no metadata server
  # wants. One tar per day is the unit; lossless xz compression keeps that
  # daily unit and `parse` reads the decompressed tar directly.
  archive: tar
  granularity: day
  compression: xz

retention:
  raw:
    keep: true                # the tar archive IS the pull; re-pulling it costs
    tier: cold                # 750k metered requests
  canonical:
    keep: true
  derived:
    keep: true

variables:
  - name: air_temperature
    source_key: ta            # 1.50 m, 1-minute mean; reported by ~45 stations,
    units: degC               # where the 10-minute mean t10 has only ~3
    long_name: Air temperature at 1.50 m
    dtype: float32
    valid_min: -60.0
    valid_max: 60.0

  - name: dew_point_temperature
    source_key: td
    units: degC
    long_name: Dew point temperature at 1.50 m
    dtype: float32
    valid_min: -60.0
    valid_max: 50.0

  - name: relative_humidity
    source_key: rh
    units: "%"
    long_name: Relative humidity at 1.50 m
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: air_pressure
    source_key: p0
    units: hPa
    long_name: Air pressure at station level
    dtype: float32
    valid_min: 500.0
    valid_max: 1100.0

  - name: air_pressure_at_sea_level
    source_key: pp
    units: hPa
    long_name: Air pressure reduced to mean sea level
    dtype: float32
    valid_min: 800.0
    valid_max: 1100.0

  - name: precipitation_amount
    source_key: rg
    units: mm
    long_name: Precipitation sum over the preceding 10 minutes
    dtype: float32
    scale: 0.16666667         # rg is a mean rate in mm/h; x 600 s / 3600 s
    valid_min: 0.0
    valid_max: 200.0

  - name: precipitation_amount_1h
    source_key: R1H           # already an amount in mm, no conversion
    units: mm
    long_name: Precipitation sum over the preceding hour
    dtype: float32
    valid_min: 0.0
    valid_max: 500.0

  - name: precipitation_duration
    source_key: dr
    units: s
    long_name: Precipitation duration (rain gauge) in the 10-minute interval
    dtype: float32
    valid_min: 0.0
    valid_max: 600.0

  - name: wind_speed
    source_key: ff
    units: m s-1
    long_name: Mean wind speed at 10 m
    dtype: float32
    valid_min: 0.0
    valid_max: 120.0

  - name: wind_from_direction
    source_key: dd
    units: degree
    long_name: Mean wind direction at 10 m
    dtype: float32
    valid_min: 0.0
    valid_max: 360.0

  - name: wind_speed_of_gust
    source_key: fx
    units: m s-1
    long_name: Maximum wind gust at 10 m over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0
    valid_max: 150.0

  - name: visibility_in_air
    source_key: vv
    units: m
    long_name: Mean horizontal visibility
    dtype: float32
    valid_min: 0.0
    valid_max: 100000.0

  - name: sunshine_duration
    source_key: ss
    units: s
    long_name: Sunshine duration over the preceding 10 minutes
    dtype: float32
    scale: 60.0               # KNMI publishes ss in minutes (10 at full sun)
    valid_min: 0.0
    valid_max: 600.0

  - name: surface_downwelling_shortwave_flux
    source_key: qg
    units: W m-2
    long_name: Global solar radiation, mean over the preceding 10 minutes
    dtype: float32
    valid_min: 0.0            # night reads exactly 0.0 in the archive, not noise
    valid_max: 1500.0

# Hash of extra.known_variables below, as `scan` reports it. Editing that
# catalogue without re-pinning this makes `parse` fail loudly rather than
# quietly widening what counts as known.
schema_fingerprint: "9bc349baef0fbd0f"

extra:
  # Missing is NaN, which `parse` nulls before scale/offset. This is here for
  # the day a numeric sentinel is pushed through instead.
  missing_sentinels: []

  # Drop observations that are not on the 600 s grid rather than snapping them.
  drop_off_cadence: true

  # The network grows -- 62 stations in 2012, 71 in 2026 -- so the station
  # table is unioned across this many days sampled evenly across the window.
  # A table read from one file silently loses every station commissioned later.
  station_scan_days: 8

  # The union of every observation variable seen in one member per year from
  # 2012 to 2026, as `scan` reports it. `tg` and `Q24H` appear in 2021 and are
  # simply absent before it, so a per-file fingerprint would reject half the
  # archive: a file carrying a SUBSET of this list is normal and passes, a file
  # carrying something not listed is drift and fails. Structural variables
  # (time, station, wsi, stationname, lat, lon, height, product, projection)
  # are excluded by the fingerprint and are read automatically.
  known_variables:
    - D1H
    - Q1H
    - Q24H
    - R12H
    - R1H
    - R24H
    - R6H
    - Sav1H
    - Sax1H
    - Sax3H
    - Sax6H
    - Sx1H
    - Sx3H
    - Sx6H
    - Tb1n6
    - Tb1x6
    - Tb2n6
    - Tb2x6
    - Tgn12
    - Tgn14
    - Tgn6
    - Tn12
    - Tn14
    - Tn6
    - Tx12
    - Tx24
    - Tx6
    - W10
    - W10-10
    - dd
    - dn
    - dr
    - dsd
    - dx
    - ff
    - ffs
    - fsd
    - fx
    - fxs
    - gff
    - gffs
    - h
    - h1
