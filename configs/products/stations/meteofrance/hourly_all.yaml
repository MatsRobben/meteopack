# Météo-France BASE hourly station observations (full variable suite),
# clipped to the KNMI radar footprint.
#
# Loads into meteopack.core.config.ProductConfig. The variable map is the whole
# of the source-specific knowledge: `source_key` is the CSV column name, which
# is exactly what the header calls it.
#
# `extra.s3_subdir` / `file_prefix` / `date_column` / `date_format` are what
# select the product inside the bucket. The 6-minute precipitation-only feed is
# the same module with BASE/MIN, prefix MN, AAAAMMJJHHMN / %Y%m%d%H%M,
# cadence_seconds 360 and a one-variable map (RR) -- a sibling YAML, not a
# second reader.
#
# Empty fields mean missing and become null before scale/offset; valid_min and
# valid_max are expressed in the canonical units below (i.e. post-scale).
# Météo-France publishes several quantities in accumulated energy (J/cm2 per
# hour) and in minutes, oktas or centimetres; everything is scaled here to the
# same canonical units the DWD product uses, so the columns are
# directly comparable across borders.

source: meteofrance
description: >-
  Meteo-France hourly climatological observations for the departements inside the radar domain.
product: hourly_all
version: 1

cadence_seconds: 3600         # the feed's native hourly step
grid_id: knmi_1km_stereo      # stations outside this footprint are dropped

store:
  kind: points
  chunks:
    time: 672                 # 4 weeks of hourly steps
    station: 64
  compressor: zstd
  compression_level: 3
  partition_by: [year]

raw_layout:
  archive: none               # one CSV per département-period is already coarse
  granularity: year

retention:
  raw:
    keep: true
    tier: cold                # ~90 files, a few hundred MB; cheap to keep
  canonical:
    keep: true
  derived:
    keep: true

variables:
  - name: precipitation_amount
    source_key: RR1
    units: mm
    long_name: Precipitation sum over the preceding hour
    dtype: float32
    valid_min: 0.0
    valid_max: 500.0

  - name: precipitation_duration
    source_key: DRR1
    units: s
    long_name: Duration of precipitation in the hour
    dtype: float32
    scale: 60.0               # published in minutes
    valid_min: 0.0
    valid_max: 3600.0

  - name: wind_speed
    source_key: FF
    units: m s-1
    long_name: Mean wind speed over 10 minutes at 10 m
    dtype: float32
    valid_min: 0.0
    valid_max: 120.0

  - name: wind_from_direction
    source_key: DD
    units: degree
    long_name: Mean wind direction at 10 m
    dtype: float32
    valid_min: 0.0
    valid_max: 360.0

  - name: wind_speed_max_10min_mean
    source_key: FXY
    units: m s-1
    long_name: Maximum 10-minute mean wind speed in the hour
    dtype: float32
    valid_min: 0.0
    valid_max: 120.0

  - name: wind_speed_of_gust
    source_key: FXI
    units: m s-1
    long_name: Maximum instantaneous wind gust in the hour
    dtype: float32
    valid_min: 0.0
    valid_max: 150.0

  - name: wind_speed_of_gust_3s
    source_key: FXI3S
    units: m s-1
    long_name: Maximum 3-second wind gust in the hour
    dtype: float32
    valid_min: 0.0
    valid_max: 150.0

  - name: air_temperature
    source_key: T
    units: degC
    long_name: Air temperature under shelter (instantaneous)
    dtype: float32
    valid_min: -60.0
    valid_max: 60.0

  - name: dew_point_temperature
    source_key: TD
    units: degC
    long_name: Dew point temperature
    dtype: float32
    valid_min: -70.0
    valid_max: 60.0

  - name: air_temperature_min
    source_key: TN
    units: degC
    long_name: Minimum air temperature in the hour
    dtype: float32
    valid_min: -60.0
    valid_max: 60.0

  - name: air_temperature_max
    source_key: TX
    units: degC
    long_name: Maximum air temperature in the hour
    dtype: float32
    valid_min: -60.0
    valid_max: 60.0

  - name: grass_minimum_temperature
    source_key: TNSOL
    units: degC
    long_name: Minimum temperature 10 cm above grass
    dtype: float32
    valid_min: -70.0
    valid_max: 80.0

  - name: road_surface_temperature
    source_key: TCHAUSSEE
    units: degC
    long_name: Road or ground surface temperature
    dtype: float32
    valid_min: -60.0
    valid_max: 90.0

  - name: soil_temperature_10cm
    source_key: T10
    units: degC
    long_name: Soil temperature at 10 cm
    dtype: float32
    valid_min: -40.0
    valid_max: 60.0

  - name: soil_temperature_20cm
    source_key: T20
    units: degC
    long_name: Soil temperature at 20 cm
    dtype: float32
    valid_min: -40.0
    valid_max: 60.0

  - name: soil_temperature_50cm
    source_key: T50
    units: degC
    long_name: Soil temperature at 50 cm
    dtype: float32
    valid_min: -40.0
    valid_max: 60.0

  - name: soil_temperature_100cm
    source_key: T100
    units: degC
    long_name: Soil temperature at 1 m
    dtype: float32
    valid_min: -40.0
    valid_max: 60.0

  - name: relative_humidity
    source_key: U
    units: "%"
    long_name: Relative humidity
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: relative_humidity_min
    source_key: UN
    units: "%"
    long_name: Minimum relative humidity in the hour
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: relative_humidity_max
    source_key: UX
    units: "%"
    long_name: Maximum relative humidity in the hour
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: water_vapor_pressure
    source_key: TSV
    units: hPa
    long_name: Water vapour pressure
    dtype: float32
    valid_min: 0.0
    valid_max: 100.0

  - name: air_pressure_at_sea_level
    source_key: PMER
    units: hPa
    long_name: Air pressure reduced to mean sea level (stations below 750 m)
    dtype: float32
    valid_min: 800.0
    valid_max: 1100.0

  - name: air_pressure
    source_key: PSTAT
    units: hPa
    long_name: Air pressure at station height
    dtype: float32
    valid_min: 500.0
    valid_max: 1100.0

  - name: cloud_area_fraction
    source_key: N
    units: "%"
    long_name: Total cloud cover
    dtype: float32
    scale: 12.5               # published in oktas; 8 oktas = 100%
    valid_min: 0.0
    valid_max: 100.0

  - name: cloud_area_fraction_lowest_layer
    source_key: NBAS
    units: "%"
    long_name: Cover of the lowest main cloud layer
    dtype: float32
    scale: 12.5               # published in oktas
    valid_min: 0.0
    valid_max: 100.0

  - name: visibility_in_air
    source_key: VV
    units: m
    long_name: Horizontal visibility
    dtype: float32
    valid_min: 0.0
    valid_max: 80000.0

  - name: present_weather
    source_key: WW
    units: "1"
    long_name: Present weather, WMO code table 4677
    dtype: float32
    valid_min: 0.0
    valid_max: 99.0

  - name: surface_snow_thickness
    source_key: NEIGETOT
    units: m
    long_name: Total snow depth on the ground
    dtype: float32
    scale: 0.01               # published in centimetres
    valid_min: 0.0
    valid_max: 10.0

  - name: fresh_snow_thickness_6h
    source_key: HNEIGEF
    units: m
    long_name: Fresh snow accumulated over 6 hours
    dtype: float32
    scale: 0.01               # published in centimetres
    valid_min: 0.0
    valid_max: 5.0

  # The four radiation columns and UV are hourly accumulations in J/cm2.
  # 1 J/cm2 = 1e4 J/m2, over 3600 s -> 1e4/3600 = 2.777778 W/m2, which is what
  # makes them comparable with the DWD flux columns.
  - name: surface_downwelling_shortwave_flux
    source_key: GLO
    units: W m-2
    long_name: Global radiation, hourly mean
    dtype: float32
    scale: 2.777778
    valid_min: -50.0
    valid_max: 1500.0

  - name: surface_direct_downwelling_shortwave_flux
    source_key: DIR
    units: W m-2
    long_name: Direct radiation, hourly mean
    dtype: float32
    scale: 2.777778
    valid_min: -50.0
    valid_max: 1500.0

  - name: surface_diffuse_downwelling_shortwave_flux
    source_key: DIF
    units: W m-2
    long_name: Diffuse radiation, hourly mean
    dtype: float32
    scale: 2.777778
    valid_min: -50.0
    valid_max: 1500.0

  - name: surface_downwelling_longwave_flux
    source_key: INFRAR
    units: W m-2
    long_name: Infra-red (longwave) radiation, hourly mean
    dtype: float32
    scale: 2.777778
    valid_min: 0.0
    valid_max: 800.0

  - name: surface_downwelling_ultraviolet_flux
    source_key: UV
    units: W m-2
    long_name: Ultra-violet radiation, hourly mean
    dtype: float32
    scale: 2.777778
    valid_min: -5.0
    valid_max: 200.0

  - name: sunshine_duration
    source_key: INS
    units: s
    long_name: Sunshine duration in the hour
    dtype: float32
    scale: 60.0               # published in minutes
    valid_min: 0.0
    valid_max: 3600.0

extra:
  # Which product inside the bucket. The 6-minute feed differs only here:
  # s3_subdir MIN, file_prefix MN, date_column AAAAMMJJHHMN, date_format
  # %Y%m%d%H%M, cadence_seconds 360, and one variable (RR).
  s3_subdir: HOR
  file_prefix: H
  date_column: AAAAMMJJHH
  date_format: "%Y%m%d%H"

  # Départements whose extent intersects the radar footprint. This is a listing
  # filter only -- stations are clipped individually against the grid polygon
  # in `parse`, so a département that contributes nothing costs one listing.
  departements:
    ["02", "08", "10", "14", "21", "25", "27", "28", "35", "41", "45", "49",
     "50", "51", "52", "53", "54", "55", "57", "59", "60", "61", "62", "67",
     "68", "70", "72", "76", "77", "78", "80", "88", "89", "90", "91", "92",
     "93", "94", "95"]

  # Column sets per period token, as `scan` reports them. Pinned per token and
  # not per product on purpose: an 1840s file genuinely has fewer columns than
  # the current one, and treating that as drift would fail every backfill. A
  # token with no entry here is not checked.
  # Pinned on 2026-10-31 against the live BASE/HOR files.
  schema_fingerprints:
    latest-2025-2026: "b7f5dac959ac7c2d"
    previous-2020-2024: "b7f5dac959ac7c2d"
    "2010-2019": "b7f5dac959ac7c2d"

  # Missing arrives as an empty field; this is here for a feed that pushes a
  # numeric sentinel through instead. Applied before scale/offset.
  missing_sentinels: []

  # Drop observations that are not on the 3600 s grid rather than snapping them.
  drop_off_cadence: true
