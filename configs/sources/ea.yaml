# UK Environment Agency Hydrology API (environment.data.gov.uk/hydrology).
#
# Keyless, Open Government Licence, plain HTTPS: a JSON station catalogue and a
# `readings.csv` bulk endpoint. The quality-controlled ("qualified") 15-minute
# rainfall series goes back to about 1990, which makes this the longest
# high-cadence gauge archive available to us without a contract.
#
# Loads into meteopack.core.config.SourceConfig.

name: ea

base_url: https://environment.data.gov.uk/hydrology

rate_limit:
  # A station-year CSV is ~1-6 MB and takes ~0.8 s, so the cost here is
  # genuinely per request. The service publishes no quota and no 429 was seen
  # while building this; the setting is therefore politeness rather than a
  # measured ceiling, and a full 35-year backfill is ~35 000 requests.
  requests_per_second: 5.0
  max_workers: 8
  max_retries: 5
  backoff_seconds: 1.0

# Open data: nothing to authenticate with.
credentials_env: []

extra:
  # A year's CSV is a few MB and the server is not fast; 120 s is not generous.
  timeout_seconds: 120
  user_agent: "meteopack/0.1 (+ea-hydrology)"
