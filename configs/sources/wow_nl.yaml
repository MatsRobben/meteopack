# WOW-NL citizen weather reports, from the local archive of yearly zips.
#
# This source does not download. The archive was pulled from the WOW API once,
# as one JSON member per UTC hour inside one zip per year, and is read from
# disk ever since; see meteopack.sources.wow_nl. `base_url` is therefore a
# file:// path, not an endpoint. The archive is read-only: the raw layer is a
# symlink to it (raw/wow_nl/reports -> $WOW_NL_ARCHIVE), never a copy.
#
# Loads into meteopack.core.config.SourceConfig.

name: wow_nl

base_url: file://${WOW_NL_ARCHIVE}

rate_limit:
  # Nothing here is rate limited: a unit is a local file.
  requests_per_second: 50.0
  max_workers: 4
  max_retries: 0
  backoff_seconds: 0.0

credentials_env: []

extra: {}
  # archive_dir: /some/other/path    # wins over base_url when set
