[project]
name = "meteopack"
version = "0.1.0"
description = "Ingest, canonicalise and pack multi-source meteorological data into analysis-ready stores."
requires-python = ">=3.12"
dependencies = [
    "zarr>=3.4",
    "xarray>=2025.1",
    "numpy>=2.0",
    "polars>=1.0",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pyproj>=3.7",
]

[project.optional-dependencies]
satellite = ["satpy>=0.50", "eumdac>=3.0"]
# eccodeslib: the ecCodes C library as a wheel (eccodes itself bundles it only on Windows)
nwp = ["cfgrib>=0.9", "eccodes>=2.38", "eccodeslib>=2.38; sys_platform == 'linux'"]
radar = ["h5py>=3.12", "h5netcdf>=1.4"]
# titanlib (MET Norway, LGPL-3): the spatial consistency test in `derive wow_nl_qc`
qc = ["titanlib>=0.4"]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
meteopack = "meteopack.cli:main"

[project.entry-points."meteopack.sources"]
# name = "meteopack.sources.<module>:<Class>"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteopack"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
